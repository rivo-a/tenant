name: Android APK

# Builds the wrapper on GitHub's runners. The downloadable APK is the
# "urbahan-apk-<n>" artifact on the run page. Release signing uses repository
# secrets when they exist; without them the release job produces an unsigned
# apk and the debug apk stays the installable one.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public address compiled into the app"
        required: false
        default: "https://tenants.example.com/tenant-system/"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Base URL
        id: base
        run: |
          URL="${{ github.event.inputs.base_url }}"
          if [ -z "$URL" ]; then URL="https://tenants.example.com/tenant-system/"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Building against $URL"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug -PbaseUrl="${{ steps.base.outputs.url }}" --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: urbahan-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/urbahan-release.jks"

      - name: Write signing config
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/urbahan-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble release
        run: ./gradlew :app:assembleRelease -PbaseUrl="${{ steps.base.outputs.url }}" --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: urbahan-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
